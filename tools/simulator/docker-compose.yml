# Optional: run the telemetry simulator as a container on the NEXUS network.
#   docker compose -f tools/simulator/docker-compose.yml up -d
# Not started by scripts/start-all.sh; on a laptop `python tools/simulator/main.py telemetry` is simpler.
name: nexus-simulator
services:
  simulator:
    build: .
    container_name: nexus-simulator
    environment:
      SERVICE_KEY: "${SERVICE_KEY:-dev-service-key}"
    command: ["--url", "http://nexus-traefik", "telemetry"]
    restart: unless-stopped
    networks:
      - nexus-net
networks:
  nexus-net:
    external: true
    name: nexus-net
