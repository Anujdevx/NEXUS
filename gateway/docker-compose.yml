version: '3.8'

services:
  traefik:
    image: "traefik:v2.10"
    container_name: "traefik-gateway"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - nexus_network

networks:
  nexus_network:
    external: true
