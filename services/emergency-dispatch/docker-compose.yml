# Generated by tools/infra/gen-compose.py. Do not edit by hand.
name: nexus-emergency-dispatch
services:
  emergency-dispatch:
    build:
      context: ..
      dockerfile: emergency-dispatch/Dockerfile
    image: nexus/emergency-dispatch:dev
    container_name: nexus-emergency-dispatch
    restart: unless-stopped
    mem_limit: 192m
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-nexus}:${RABBITMQ_PASS:-nexus-rabbit}@nexus-rabbitmq:5672/"
      REDIS_URL: "redis://nexus-redis:6379/0"
      JWT_SECRET: "${JWT_SECRET:-dev-only-change-me}"
      SERVICE_KEY: "${SERVICE_KEY:-dev-service-key}"
      SEED_DIR: "/seed"
      DATABASE_URL: "postgres://nexus:${POSTGRES_PASSWORD:-nexus}@nexus-emergency-dispatch-db:5432/dispatch?sslmode=disable"
      GRAPH_URL: "http://nexus-graph-engine:8080"
    volumes:
      - ../../tools/seed/out:/seed:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - nexus-net
      - private
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nexus-net"
      - "traefik.http.routers.emergency-dispatch.rule=PathPrefix(`/api/v1/dispatch`) || PathPrefix(`/api/v1/hospitals`) || PathPrefix(`/api/v1/units`) || PathPrefix(`/api/v1/shelters`) || PathPrefix(`/api/v1/pharmacies`) || PathPrefix(`/svc/emergency-dispatch`)"
      - "traefik.http.routers.emergency-dispatch.entrypoints=web"
      - "traefik.http.services.emergency-dispatch.loadbalancer.server.port=8080"

  db:
    image: postgres:16-alpine
    container_name: nexus-emergency-dispatch-db
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nexus}"
      POSTGRES_DB: dispatch
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d dispatch"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - private

networks:
  nexus-net:
    external: true
    name: nexus-net
  private: {}

volumes:
  pg-data: {}
