# Generated by tools/infra/gen-compose.py. Do not edit by hand.
name: nexus-identity-access
services:
  identity-access:
    build:
      context: ..
      dockerfile: identity-access/Dockerfile
    image: nexus/identity-access:dev
    container_name: nexus-identity-access
    restart: unless-stopped
    mem_limit: 128m
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-nexus}:${RABBITMQ_PASS:-nexus-rabbit}@nexus-rabbitmq:5672/"
      REDIS_URL: "redis://nexus-redis:6379/0"
      JWT_SECRET: "${JWT_SECRET:-dev-only-change-me}"
      SERVICE_KEY: "${SERVICE_KEY:-dev-service-key}"
      SEED_DIR: "/seed"
      DATABASE_URL: "postgres://nexus:${POSTGRES_PASSWORD:-nexus}@nexus-identity-access-db:5432/identity?sslmode=disable"
      DEMO_MODE: "${DEMO_MODE:-true}"
      DEMO_CONTROLLER_PASSWORD: "${DEMO_CONTROLLER_PASSWORD:-nexus-demo}"
      DEMO_RESPONDER_PASSWORD: "${DEMO_RESPONDER_PASSWORD:-nexus-demo}"
      DEMO_CITIZEN_PASSWORD: "${DEMO_CITIZEN_PASSWORD:-nexus-demo}"
    volumes:
      - ../../tools/seed/out:/seed:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - nexus-net
      - private
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nexus-net"
      - "traefik.http.routers.identity-access.rule=PathPrefix(`/api/v1/auth`) || PathPrefix(`/svc/identity-access`)"
      - "traefik.http.routers.identity-access.entrypoints=web"
      - "traefik.http.services.identity-access.loadbalancer.server.port=8080"

  db:
    image: postgres:16-alpine
    container_name: nexus-identity-access-db
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nexus}"
      POSTGRES_DB: identity
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d identity"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - private

networks:
  nexus-net:
    external: true
    name: nexus-net
  private: {}

volumes:
  pg-data: {}
