      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - nexus-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nexus-net"
      - "traefik.http.routers.media-storage.rule=PathPrefix(`/api/v1/media`) || PathPrefix(`/svc/media-storage`)"
      - "traefik.http.routers.media-storage.entrypoints=web"
