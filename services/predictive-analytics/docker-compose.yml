name: nexus-predictive-analytics
services:
  predictive-analytics:
    build:
      context: ..
      dockerfile: predictive-analytics/Dockerfile
    image: nexus/predictive-analytics:dev
    container_name: nexus-predictive-analytics
    restart: unless-stopped
    mem_limit: 128m
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-nexus}:${RABBITMQ_PASS:-nexus-rabbit}@nexus-rabbitmq:5672/"
      REDIS_URL: "redis://nexus-redis:6379/0"
      JWT_SECRET: "${JWT_SECRET:-dev-only-change-me}"
      SERVICE_KEY: "${SERVICE_KEY:-dev-service-key}"
      SEED_DIR: "/seed"
      GRAPH_URL: "http://nexus-graph-engine:8080"
      TRAFFIC_URL: "http://nexus-traffic-control:8080"
    volumes:
      - ../../tools/seed/out:/seed:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - nexus-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nexus-net"
      - "traefik.http.routers.predictive-analytics.rule=PathPrefix(`/api/v1/hazard`) || PathPrefix(`/api/v1/analytics`) || PathPrefix(`/svc/predictive-analytics`)"
      - "traefik.http.routers.predictive-analytics.entrypoints=web"
      - "traefik.http.services.predictive-analytics.loadbalancer.server.port=8080"

networks:
  nexus-net:
    external: true
    name: nexus-net
