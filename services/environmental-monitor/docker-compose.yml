version: '3.8'

services:
  environmental-monitor-app:
    build: .
    container_name: environmental-monitor-app
    ports:
      - "8008:8008"
    environment:
      - PORT=8008
      - DATABASE_URL=postgres://user:password@environmental-monitor-db:5432/environmental-monitor?sslmode=disable
    networks:
      - nexus_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.environmental-monitor.rule=PathPrefix(`/environmental-monitor`)"
      - "traefik.http.services.environmental-monitor.loadbalancer.server.port=8008"

  environmental-monitor-db:
    image: postgres:15-alpine
    container_name: environmental-monitor-db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=environmental-monitor
    volumes:
      - environmental-monitor-pg-data:/var/lib/postgresql/data
    networks:
      - nexus_network
volumes:
  environmental-monitor-pg-data:

networks:
  nexus_network:
    external: true
