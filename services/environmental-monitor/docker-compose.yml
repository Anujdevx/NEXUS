# Generated by tools/infra/gen-compose.py. Do not edit by hand.
name: nexus-environmental-monitor
services:
  environmental-monitor:
    build:
      context: ..
      dockerfile: environmental-monitor/Dockerfile
    image: nexus/environmental-monitor:dev
    container_name: nexus-environmental-monitor
    restart: unless-stopped
    mem_limit: 128m
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-nexus}:${RABBITMQ_PASS:-nexus-rabbit}@nexus-rabbitmq:5672/"
      REDIS_URL: "redis://nexus-redis:6379/0"
      JWT_SECRET: "${JWT_SECRET:-dev-only-change-me}"
      SERVICE_KEY: "${SERVICE_KEY:-dev-service-key}"
      SEED_DIR: "/seed"
      DATABASE_URL: "postgres://nexus:${POSTGRES_PASSWORD:-nexus}@nexus-environmental-monitor-db:5432/environment?sslmode=disable"
    volumes:
      - ../../tools/seed/out:/seed:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - nexus-net
      - private
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nexus-net"
      - "traefik.http.routers.environmental-monitor.rule=PathPrefix(`/api/v1/environment`) || PathPrefix(`/svc/environmental-monitor`)"
      - "traefik.http.routers.environmental-monitor.entrypoints=web"
      - "traefik.http.services.environmental-monitor.loadbalancer.server.port=8080"

  db:
    image: postgres:16-alpine
    container_name: nexus-environmental-monitor-db
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nexus}"
      POSTGRES_DB: environment
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d environment"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - private

networks:
  nexus-net:
    external: true
    name: nexus-net
  private: {}

volumes:
  pg-data: {}
