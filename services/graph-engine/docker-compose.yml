version: '3.8'

services:
  graph-engine-app:
    build: .
    container_name: graph-engine-app
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - NEO4J_URI=bolt://graph-engine-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    networks:
      - nexus_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.graph-engine.rule=PathPrefix(`/graph-engine`)"
      - "traefik.http.services.graph-engine.loadbalancer.server.port=8001"

  graph-engine-neo4j:
    image: neo4j:5
    container_name: graph-engine-neo4j
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - graph-engine-neo4j-data:/data
    networks:
      - nexus_network
volumes:
  graph-engine-neo4j-data:

networks:
  nexus_network:
    external: true
