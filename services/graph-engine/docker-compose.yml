# Generated by tools/infra/gen-compose.py. Do not edit by hand.
name: nexus-graph-engine
services:
  graph-engine:
    build:
      context: ..
      dockerfile: graph-engine/Dockerfile
    image: nexus/graph-engine:dev
    container_name: nexus-graph-engine
    restart: unless-stopped
    mem_limit: 768m
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-nexus}:${RABBITMQ_PASS:-nexus-rabbit}@nexus-rabbitmq:5672/"
      REDIS_URL: "redis://nexus-redis:6379/0"
      JWT_SECRET: "${JWT_SECRET:-dev-only-change-me}"
      SERVICE_KEY: "${SERVICE_KEY:-dev-service-key}"
      SEED_DIR: "/seed"
      NEO4J_URI: "bolt://nexus-graph-engine-neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-nexus-neo4j}"
      ROADS_FILE: "/frontend-public/roads.json"
    volumes:
      - ../../tools/seed/out:/seed:ro
      - ../../frontend/public:/frontend-public:ro
    depends_on:
      neo4j:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - nexus-net
      - private
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nexus-net"
      - "traefik.http.routers.graph-engine.rule=PathPrefix(`/api/v1/graph`) || PathPrefix(`/api/v1/routes`) || PathPrefix(`/api/v1/topology`) || PathPrefix(`/svc/graph-engine`)"
      - "traefik.http.routers.graph-engine.entrypoints=web"
      - "traefik.http.services.graph-engine.loadbalancer.server.port=8080"

  neo4j:
    image: neo4j:5
    container_name: nexus-graph-engine-neo4j
    restart: unless-stopped
    mem_limit: 1100m
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-nexus-neo4j}"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "512m"
      NEO4J_server_memory_pagecache_size: "256m"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - private

networks:
  nexus-net:
    external: true
    name: nexus-net
  private: {}

volumes:
  neo4j-data: {}
